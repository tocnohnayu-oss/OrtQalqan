name: Build and browser checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node scripts/server-smoke.mjs
      - name: Check the runner browser
        run: google-chrome --version
      - run: npm run smoke
        env:
          ORTQALQAN_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ortqalqan-build
          include-hidden-files: true
          path: |
            dist/
            package-lock.json
            qa/
          retention-days: 14
      - name: Save visual review images
        if: success() && github.event_name == 'push'
        run: bash scripts/publish-review.sh
